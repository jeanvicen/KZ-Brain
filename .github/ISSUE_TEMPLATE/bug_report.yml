name: Correção documental ou estrutural
description: Relate um erro verificável na documentação, estrutura ou configuração.
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: "Não inclua segredos ou dados pessoais. O runtime ainda não existe."
  - type: input
    id: location
    attributes:
      label: Arquivo ou caminho
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: O que está incorreto?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Correção sugerida
    validations:
      required: true
